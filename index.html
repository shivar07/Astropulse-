<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA Astronomy Picture of the Day</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌌</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-space: #ffffff; 
      --bg-panel: transparent; 
      
      --border-subtle: transparent;
      --border-focus: #0f172a;
      
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      
      --accent-color: #4f46e5;
      
      --font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      --transition-smooth: all 0.2s ease;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-space);
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-space);
      color: var(--text-primary);
      font-family: var(--font-family);
      overflow-x: hidden;
      min-height: 100vh;
    }

    .dashboard-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 0 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 0 20px 0;
      background: transparent;
      border-bottom: none;
      margin-top: 10px;
    }

    .header-left h1 {
      font-family: var(--font-family);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .accent-text {
      color: var(--accent-color);
    }

    .control-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .control-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dashboard-input {
      background: #f1f5f9;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 0.9rem;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      width: 160px;
      text-align: center;
      transition: var(--transition-smooth);
    }

    .dashboard-input:focus {
      background: #e2e8f0;
    }

    .dashboard-input::-webkit-calendar-picker-indicator {
      cursor: pointer;
    }

    #app {
      flex: 1;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 30px;
      padding: 20px 0;
      min-height: calc(100vh - 160px);
    }

    .viewport-panel {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 450px;
    }

    .media-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      overflow: hidden;
      background: #f8fafc;
      border: none;
    }

    .viewport-image {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      display: block;
    }

    .viewport-video {
      width: 100%;
      max-height: 70vh;
      aspect-ratio: 16/9;
      border: none;
      background: #f8fafc;
      display: block;
    }

    .viewport-iframe {
      width: 100%;
      height: 100%;
      min-height: 480px;
      aspect-ratio: 16/9;
      border: none;
      background: #f8fafc;
      display: block;
    }

    .readout-panel {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .readout-card {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
    }

    .meta-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .meta-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .meta-value {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .readout-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 18px;
      letter-spacing: -0.5px;
    }

    .readout-explanation {
      font-size: 0.95rem;
      line-height: 1.65;
      color: var(--text-secondary);
      font-weight: 400;
      text-align: justify;
    }

    .hud-readout-header {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-readout-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #f1f5f9;
    }

    .hd-link {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      background: #f1f5f9;
      transition: var(--transition-smooth);
      display: inline-block;
      cursor: pointer;
    }

    .hd-link:hover {
      background: #e2e8f0;
    }

    .hd-link:active {
      transform: scale(0.98);
    }

    .error-container {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 400px;
      background: transparent;
      border: none;
    }

    .error-icon {
      font-size: 2.5rem;
      color: #ef4444;
      margin-bottom: 12px;
    }

    .error-title {
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .error-message {
      color: #991b1b;
      font-size: 0.9rem;
      max-width: 450px;
      text-align: center;
      background: #fef2f2;
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
    }

    .animate-fade-in {
      animation: fadeInUp 0.3s ease forwards;
      opacity: 0;
    }

    .viewport-panel.animate-fade-in {
      animation-delay: 0.05s;
    }

    .readout-panel.animate-fade-in {
      animation-delay: 0.1s;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hud-nav-btn, .hud-action-btn {
      background: #f1f5f9;
      border: none;
      color: var(--text-primary);
      font-family: var(--font-family);
      font-size: 0.8rem;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: var(--transition-smooth);
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      font-weight: 600;
    }

    .hud-nav-btn:hover, .hud-action-btn:hover {
      background: #e2e8f0;
    }

    .hud-nav-btn:active, .hud-action-btn:active {
      transform: scale(0.97);
    }

    .hud-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }

    .hud-action-btn.active {
      background: #0f172a !important;
      color: #ffffff !important;
    }

    @media (max-width: 1024px) {
      #app {
        grid-template-columns: 1fr;
        gap: 20px;
        min-height: auto;
      }
      
      .viewport-panel {
        min-height: 400px;
      }
    }

    @media (max-width: 768px) {
      .control-row {
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
      }
    }

    @media (max-width: 600px) {
      .dashboard-wrapper {
        padding: 0 10px;
      }
      
      .dashboard-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
        padding: 15px 0;
      }
      
      .control-panel {
        align-items: flex-start;
        width: 100%;
      }
      
      .dashboard-input {
        width: 100%;
      }
      
      .header-left h1 {
        font-size: 1.3rem;
      }
      
      .viewport-panel {
        min-height: 300px;
      }
      
      .viewport-iframe {
        min-height: 300px;
      }
      
      .readout-card {
        padding: 0;
      }
      
      .readout-title {
        font-size: 1.3rem;
      }
    }
  </style>
</head>

<body>
  <div class="dashboard-wrapper">
    <header class="dashboard-header">
      <div class="header-left">
        <h1>NASA Astronomy Picture <span class="accent-text">of the Day</span></h1>
      </div>
      <div class="header-right">
        <div class="control-panel">
          <label class="control-label">Select Date</label>
          <div class="control-row">
            <button class="hud-nav-btn" id="prev-sol-btn" title="Previous Day (Left Arrow)">◀ Previous</button>
            <input type="date" id="datepicker" class="dashboard-input" />
            <button class="hud-nav-btn" id="next-sol-btn" title="Next Day (Right Arrow)">Next ▶</button>
            <button class="hud-action-btn" id="random-telemetry-btn" title="Random Image">Random</button>
            <button class="hud-action-btn" id="auto-scan-btn" title="Toggle Auto Play">Auto Play: OFF</button>
          </div>
        </div>
      </div>
    </header>

    <main id="app"></main>
  </div>

  <script type="module">
    const API_KEY = '4y5ri2Geh17rxqbkn8itSIot8GdCOmVUeFCyabbY';

    const appContainer = document.querySelector('#app');
    const datePicker = document.querySelector('#datepicker');

    const getTodayDateString = () => {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const todayStr = getTodayDateString();
    let currentDate = todayStr;

    const minDateStr = '1995-06-16';
    const todayDateStr = todayStr;

    if (datePicker) {
      datePicker.max = todayStr;
      datePicker.min = minDateStr;
      datePicker.value = todayStr;
    }

    let isAutoScanning = false;
    let countdownVal = 15;
    let countdownTimer = null;

    const updateNavButtonsState = () => {
      const prevBtn = document.getElementById('prev-sol-btn');
      const nextBtn = document.getElementById('next-sol-btn');
      
      if (prevBtn) {
        prevBtn.disabled = currentDate === minDateStr;
      }
      if (nextBtn) {
        nextBtn.disabled = currentDate === todayDateStr;
      }
    };

    const downloadImage = (url, filename) => {
      const downloadBtn = document.querySelector('.download-link');
      const originalText = downloadBtn ? downloadBtn.textContent : 'Download Image';
      if (downloadBtn) {
        downloadBtn.textContent = 'Downloading...';
        downloadBtn.style.pointerEvents = 'none';
        downloadBtn.style.opacity = '0.6';
      }

      fetch(url)
        .then((response) => {
          if (!response.ok) throw new Error('Blob fetch failed');
          return response.blob();
        })
        .then((blob) => {
          const blobUrl = URL.createObjectURL(blob);
          const tempLink = document.createElement('a');
          tempLink.href = blobUrl;
          tempLink.download = filename || 'nasa-apod-image.jpg';
          document.body.appendChild(tempLink);
          tempLink.click();
          document.body.removeChild(tempLink);
          URL.revokeObjectURL(blobUrl);
        })
        .catch((err) => {
          console.error('Download failed, opening in new tab:', err);
          window.open(url, '_blank');
        })
        .finally(() => {
          if (downloadBtn) {
            downloadBtn.textContent = originalText;
            downloadBtn.style.pointerEvents = 'auto';
            downloadBtn.style.opacity = '1';
          }
        });
    };

    const showLoading = () => {
      // Clean slate transition (no flashy loading bars)
    };

    const showError = (message) => {
      appContainer.innerHTML = `
        <div class="error-container">
          <div class="error-icon">⚠</div>
          <div class="error-title">Unable to Load Content</div>
          <div class="error-message">${message}</div>
        </div>
      `;
    };

    const buildMediaHTML = (data) => {
      const mediaUrl = data.url;
      const mediaType = data.media_type;

      if (mediaType === 'image') {
        return `<img class="viewport-image" src="${mediaUrl}" alt="${data.title || 'NASA Astronomy Picture'}" />`;
      } else if (mediaType === 'video') {
        if (mediaUrl.includes('youtube.com') || mediaUrl.includes('youtu.be')) {
          let embedUrl = mediaUrl;
          if (mediaUrl.includes('watch?v=')) {
            const videoId = mediaUrl.split('v=')[1]?.split('&')[0];
            embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1`;
          } else if (mediaUrl.includes('youtu.be/')) {
            const videoId = mediaUrl.split('youtu.be/')[1]?.split('?')[0];
            embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1`;
          }
          return `<iframe class="viewport-iframe" src="${embedUrl}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
        } else {
          return `<video class="viewport-video" src="${mediaUrl}" controls autoplay loop></video>`;
        }
      } else {
        return `<iframe class="viewport-iframe" src="${mediaUrl}" allowfullscreen></iframe>`;
      }
    };

    const fetchWithTimeout = (url, options = {}, timeout = 8000) => {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      
      return fetch(url, {
        ...options,
        signal: controller.signal
      }).finally(() => clearTimeout(id));
    };

    const fetchAPOD = (date = '') => {
      showLoading();

      if (!API_KEY) {
        showError('NASA API Key is missing.');
        return;
      }

      let queryUrl = `https://api.nasa.gov/planetary/apod?api_key=${API_KEY}`;
      if (date) {
        queryUrl += `&date=${date}`;
      }

      fetchWithTimeout(queryUrl, {}, 8000)
        .then((response) => {
          if (!response.ok) {
            return response.json().then(
              (errData) => {
                throw new Error(errData.msg || errData.error?.message || `HTTP error ${response.status}`);
              },
              () => {
                throw new Error(`HTTP network error ${response.status}`);
              }
            );
          }
          return response.json();
        })
        .then((data) => {
          const title = data.title || 'Untitled';
          const explanation = data.explanation || 'No description available for this date.';
          const displayDate = data.date || date || todayStr;
          const mediaHTML = buildMediaHTML(data);
          const copyright = data.copyright ? data.copyright.replace(/\n/g, ' ').trim() : 'Public Domain';

          appContainer.innerHTML = `
            <section class="viewport-panel animate-fade-in">
              <div class="media-container">
                ${mediaHTML}
              </div>
            </section>

            <section class="readout-panel animate-fade-in">
              <div class="readout-card">
                <div class="meta-group">
                  <div class="meta-item">
                    <span class="meta-label">Date</span>
                    <div class="meta-value">${displayDate}</div>
                  </div>
                  <div class="meta-item">
                    <span class="meta-label">Agency</span>
                    <div class="meta-value">NASA APOD</div>
                  </div>
                </div>

                <h2 class="readout-title">${title}</h2>
                
                <div class="meta-group" style="margin-top: -8px; border-bottom: none; padding-bottom: 0;">
                  <div class="meta-item">
                    <span class="meta-label">Type</span>
                    <div class="meta-value">
                      ${data.media_type.toUpperCase()}
                    </div>
                  </div>
                  <div class="meta-item">
                    <span class="meta-label">Copyright</span>
                    <div class="meta-value" style="font-size: 0.85rem;">
                      ${copyright.toUpperCase()}
                    </div>
                  </div>
                </div>
              </div>

              <div class="readout-card" style="flex: 1;">
                <h3 class="hud-readout-header">Description</h3>
                <p class="readout-explanation">${explanation}</p>
                ${
                  data.media_type === 'image'
                    ? `
                  <div class="hd-link-wrapper" style="margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap;">
                    ${
                      data.hdurl
                        ? `<a href="${data.hdurl}" target="_blank" class="hd-link">View HD Image</a>`
                        : ''
                    }
                    <button class="hd-link download-link" id="download-apod-btn">Download Image</button>
                  </div>
                `
                    : ''
                }
              </div>
            </section>
          `;

          if (datePicker) {
            datePicker.value = displayDate;
          }
          currentDate = displayDate;
          updateNavButtonsState();

          const downloadBtn = document.getElementById('download-apod-btn');
          if (downloadBtn) {
            downloadBtn.addEventListener('click', () => {
              const filename = `NASA-APOD-${displayDate}.jpg`;
              const downloadUrl = data.hdurl || data.url;
              downloadImage(downloadUrl, filename);
            });
          }
        })
        .catch((error) => {
          console.error('NASA APOD Fetch Error:', error);
          
          let errorMsg = error.message || 'Unknown network error.';
          if (error.name === 'AbortError') {
            errorMsg = 'Request timed out. Please check your internet connection or check your NASA API key quota.';
          }
          
          showError(errorMsg);
          
          if (errorMsg.toLowerCase().includes('rate limit') || errorMsg.includes('429')) {
            stopAutoScan();
          }
        });
    };

    if (datePicker) {
      datePicker.addEventListener('change', (e) => {
        currentDate = e.target.value;
        stopAutoScan();
        fetchAPOD(currentDate);
      });
    }

    const stepDate = (direction) => {
      stopAutoScan();
      let tempDate = new Date(currentDate);
      if (isNaN(tempDate.getTime())) {
        tempDate = new Date();
      }
      tempDate.setDate(tempDate.getDate() + direction);
      
      const y = tempDate.getFullYear();
      const m = String(tempDate.getMonth() + 1).padStart(2, '0');
      const d = String(tempDate.getDate()).padStart(2, '0');
      const targetDateStr = `${y}-${m}-${d}`;
      
      const minDate = new Date(minDateStr);
      const maxDate = new Date(todayDateStr);
      
      if (tempDate >= minDate && tempDate <= maxDate) {
        currentDate = targetDateStr;
        if (datePicker) {
          datePicker.value = currentDate;
        }
        fetchAPOD(currentDate);
      }
    };

    const fetchRandomAPOD = () => {
      const minDate = new Date(minDateStr).getTime();
      const maxDate = new Date(todayDateStr).getTime();
      const randomTime = minDate + Math.random() * (maxDate - minDate);
      const randomDate = new Date(randomTime);
      
      const y = randomDate.getFullYear();
      const m = String(randomDate.getMonth() + 1).padStart(2, '0');
      const d = String(randomDate.getDate()).padStart(2, '0');
      
      currentDate = `${y}-${m}-${d}`;
      if (datePicker) {
        datePicker.value = currentDate;
      }
      fetchAPOD(currentDate);
    };

    const startAutoScan = () => {
      isAutoScanning = true;
      const scanBtn = document.getElementById('auto-scan-btn');
      if (scanBtn) {
        scanBtn.classList.add('active');
        scanBtn.textContent = `Playing: ${countdownVal}s`;
      }
      
      countdownTimer = setInterval(() => {
        countdownVal--;
        if (countdownVal <= 0) {
          countdownVal = 15;
          fetchRandomAPOD();
        }
        if (scanBtn) {
          scanBtn.textContent = `Playing: ${countdownVal}s`;
        }
      }, 1000);
    };

    const stopAutoScan = () => {
      if (!isAutoScanning) return;
      isAutoScanning = false;
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }
      countdownVal = 15;
      const scanBtn = document.getElementById('auto-scan-btn');
      if (scanBtn) {
        scanBtn.classList.remove('active');
        scanBtn.textContent = 'Auto Play: OFF';
      }
    };

    const toggleAutoScan = () => {
      if (isAutoScanning) {
        stopAutoScan();
      } else {
        startAutoScan();
      }
    };

    document.getElementById('prev-sol-btn')?.addEventListener('click', () => stepDate(-1));
    document.getElementById('next-sol-btn')?.addEventListener('click', () => stepDate(1));
    document.getElementById('random-telemetry-btn')?.addEventListener('click', () => {
      stopAutoScan();
      fetchRandomAPOD();
    });
    document.getElementById('auto-scan-btn')?.addEventListener('click', toggleAutoScan);

    window.addEventListener('keydown', (e) => {
      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'SELECT' || activeEl.tagName === 'TEXTAREA')) {
        return;
      }
      
      if (e.key === 'ArrowLeft') {
        stepDate(-1);
      } else if (e.key === 'ArrowRight') {
        stepDate(1);
      }
    });

    fetchAPOD();
  </script>
</body>

</html>
